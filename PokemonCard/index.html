<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motion Holo Card</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: "Trebuchet MS", "Segoe UI", sans-serif;
            --tilt-x: 0deg;
            --tilt-y: 0deg;
            --shear: 0deg;
            --shine-x: 50%;
            --shine-y: 50%;
            --shine-angle: 118deg;
            --card-gradient: linear-gradient(135deg, #19b7a5, #377be0 52%, #e454a3);
        }

        * {
            box-sizing: border-box;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 18px;
            min-height: 100vh;
            margin: 0;
            padding: 24px 16px;
            background:
                radial-gradient(ellipse at 50% 38%, rgba(38, 80, 98, 0.42), transparent 46%),
                radial-gradient(circle at 15% 80%, rgba(14, 130, 111, 0.17) 1px, transparent 1.5px) 0 0 / 24px 24px,
                #101b20;
        }

        #gradientButton {
            position: relative;
            isolation: isolate;
            display: block;
            width: min(78vw, 340px, calc((100vh - 90px) * 0.70));
            aspect-ratio: 402 / 605;
            padding: 0;
            overflow: hidden;
            border: 4px solid #d0be22;
            border-radius: 12px;
            cursor: pointer;
            color: white;
            background: #d0be22 url("CardPoke.png") center / 100% 100% no-repeat;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.48), 0 0 0 1px rgba(255, 255, 255, 0.32) inset;
            transform: perspective(900px) rotateX(var(--tilt-x)) rotateY(var(--tilt-y)) skewX(var(--shear));
            transition: transform 220ms cubic-bezier(0.4, 0, 0.2, 1), box-shadow 220ms cubic-bezier(0.4, 0, 0.2, 1);
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        #gradientButton::before,
        #gradientButton::after {
            position: absolute;
            z-index: -1;
            inset: 0;
            border-radius: inherit;
            content: "";
            pointer-events: none;
        }

        #gradientButton::before {
            opacity: 0.58;
            background:
                radial-gradient(ellipse at var(--shine-x) var(--shine-y), rgba(255, 255, 255, 0.96), rgba(255, 255, 255, 0.22) 8%, transparent 22%),
                linear-gradient(var(--shine-angle), transparent 18%, rgba(255, 255, 255, 0.12) 28%, rgba(255, 255, 255, 0.88) 34%, rgba(105, 255, 238, 0.28) 38%, transparent 54%),
                linear-gradient(135deg, rgba(255, 71, 176, 0.55), rgba(255, 231, 90, 0.18) 24%, rgba(66, 244, 218, 0.46) 48%, rgba(90, 113, 255, 0.5) 72%, rgba(255, 95, 163, 0.45)),
                var(--card-gradient);
            background-blend-mode: screen, screen, soft-light, soft-light;
            mix-blend-mode: screen;
            transition: opacity 220ms ease;
        }

        #gradientButton::after {
            inset: 0;
            border: 1px solid rgba(255, 255, 255, 0.56);
            background:
                linear-gradient(145deg, rgba(255, 255, 255, 0.12), transparent 34%, rgba(12, 22, 42, 0.08)),
                linear-gradient(0deg, transparent 79%, rgba(255, 255, 255, 0.12));
            box-shadow: inset 0 0 30px rgba(255, 255, 255, 0.12);
        }

        #gradientButton:hover {
            box-shadow: 0 38px 82px rgba(0, 0, 0, 0.55), 0 0 34px rgba(86, 228, 219, 0.22), 0 0 0 1px rgba(255, 255, 255, 0.45) inset;
        }

        #gradientButton:focus-visible {
            outline: 3px solid #fff;
            outline-offset: 7px;
        }

        #statusText {
            display: block;
            color: rgba(255, 255, 255, 0.82);
            font-size: 13px;
            text-align: center;
            text-shadow: 0 1px 8px rgba(0, 0, 0, 0.65);
        }

        @media (prefers-reduced-motion: reduce) {
            #gradientButton {
                transition: none;
            }
        }
    </style>
</head>
<body>
    <button id="gradientButton" type="button" aria-label="Enable motion controls for Charizard card" aria-pressed="false"></button>
    <p id="statusText" aria-live="polite">Tap the card to enable motion</p>
    <script src="script.js"></script>
</body>
</html>
